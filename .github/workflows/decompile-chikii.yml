name: Decompile Chikii

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK URL to decompile
        required: false
        default: https://github.com/matthewcodergamer/apks-/releases/download/chikii-4.16.0/Chikii.apk
      run_apktool:
        description: Also decode resources and smali with apktool
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chikii-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Download APK
        run: |
          mkdir -p work
          curl -fL --retry 3 --retry-delay 5 -o work/chikii.apk "${{ inputs.apk_url }}"
          ls -lh work/chikii.apk
          sha256sum work/chikii.apk

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip curl
          curl -fL --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx /opt/jadx/bin/jadx-gui
          curl -fL --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          /opt/jadx/bin/jadx --version
          java -jar /tmp/apktool.jar --version

      - name: Decompile with jadx
        run: |
          JAVA_OPTS="-Xmx8g" /opt/jadx/bin/jadx \
            --threads-count 4 \
            --show-bad-code \
            --deobf \
            -d work/jadx \
            work/chikii.apk

      - name: Decode with apktool
        if: inputs.run_apktool
        run: |
          java -Xmx8g -jar /tmp/apktool.jar d -f work/chikii.apk -o work/apktool

      - name: Package output
        run: |
          cd work
          zip -qr chikii-jadx.zip jadx
          if [ -d apktool ]; then
            zip -qr chikii-apktool.zip apktool
          fi
          ls -lh ./*.zip

      - name: Upload decompiled output
        uses: actions/upload-artifact@v4
        with:
          name: chikii-decompiled
          path: |
            work/chikii-jadx.zip
            work/chikii-apktool.zip
          compression-level: 0
          retention-days: 30
