name: Patch Turbo VPN ads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'turbo-vpn-4.3.2.2-arm64.apk'
      - 'scripts/patch_apk.py'
      - 'patches/**'
      - '.github/workflows/patch.yml'

permissions:
  contents: read

concurrency:
  group: turbo-vpn-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aapt libsmali-java zipalign zip unzip
          baksmali --version
          smali --version
          zipalign 2>&1 | head -2

      - name: Download uber-apk-signer
        run: |
          curl -fsSL --retry 3 -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          ls -lh uber-apk-signer.jar

      - name: Disassemble, patch, reassemble, align, sign, verify
        run: |
          python3 scripts/patch_apk.py \
            --apk turbo-vpn-4.3.2.2-arm64.apk \
            --out dist/turbo-vpn-4.3.2.2-arm64-ads-vip-log.apk \
            --signer uber-apk-signer.jar

      - name: Inspect artifact
        run: |
          ls -lh dist
          sha256sum dist/*.apk | tee dist/SHA256SUMS
          aapt dump badging dist/*.apk | head -3
          unzip -l dist/*.apk | grep -E \
            'lib/arm64-v8a/(libovpnutil|libxray)\.so|classes5?\.dex'

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: turbo-vpn-4.3.2.2-arm64-ads-vip-log
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
